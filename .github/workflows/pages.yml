# Publish the rendered site to GitHub Pages on every push to main.
#
# The pages are rendered locally (mise run views) and committed, so this only
# stages what the browser needs and uploads it: Today (index.html), site/
# (schedule, talk hubs, themes, people), talks/ (story pages, their images,
# the markdown they link to) and the talk runtime. Audio and raw photos are
# gitignored, so they are not on the published site.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site
        run: |
          mkdir -p _site/stories
          cp index.html _site/
          cp -R site talks atlases _site/
          rm -f _site/site/followups.html
          cp -R stories/runtime _site/stories/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
