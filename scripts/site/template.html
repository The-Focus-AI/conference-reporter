<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*SITE_TITLE*/</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Quadrangle, the user's own system from the Walking Thoughts field manual, applied to a
   conference survey sheet. Deliberately single-theme: dusk forest, every colour explicit.
   Layout: route, don't review. The guide proposes, you confirm, and a decision lands on
   your calendar and on the floor plan in the same gesture. */
:root {
  color-scheme: dark;
  --ground: #17231b;
  --deep: #101712;
  --surface: #1e2c22;
  --raised: #24352a;
  --ink: #f2f1e8;
  --ink-muted: #b9bcae;
  --line: rgba(242, 241, 232, 0.16);
  --line-strong: rgba(242, 241, 232, 0.38);
  --action: #f4cf72;      /* the armed choice; your calendar */
  --identity: #a9d18f;    /* a GO call */
  --attention: #f0b4a0;   /* clashes and tight changes */
  --machine: #8fb8d8;     /* what the guide says; links */
  --on-action: #17231b;
  --sheet: #ffffff;       /* the plans are printed on white */
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue Condensed", system-ui, sans-serif;
  --capture: Georgia, "Times New Roman", serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--ground); color: var(--ink); font: .98rem/1.55 var(--body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 4rem;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ground); }
.sheet { max-width: 68rem; margin-inline: auto; display: grid; grid-template-columns: minmax(0, 1fr); }
.sheet > * { min-width: 0; }
a { color: var(--machine); }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--identity); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

.mono { font: 700 .66rem/1.4 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-muted); }
h2 { font: 600 1.7rem/1.05 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; text-wrap: balance; }
.lede { color: var(--ink-muted); max-width: 42rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--machine); text-decoration: underline; text-underline-offset: .15em; font-size: .86rem; }
.linkish:hover { color: var(--ink); }

/* Masthead */
.masthead { text-align: center; padding-block: clamp(1.6rem, 5vw, 2.8rem) 1.1rem; border-bottom: 1px solid var(--line-strong); }
.masthead .agency { letter-spacing: .3em; margin-bottom: .8rem; font-size: .62rem; }
.masthead h1 { font: 600 clamp(2rem, 7vw, 3.1rem)/.95 var(--display); letter-spacing: .03em; text-transform: uppercase; text-wrap: balance; margin: 0; }
.masthead .sub { font: italic 1.04rem/1.45 var(--capture); color: var(--ink-muted); margin: .8rem auto 0; max-width: 34rem; }
@media (max-width: 40rem) { .masthead { padding-block: 1.1rem .7rem; } .masthead .sub { display: none; } .masthead .agency { margin-bottom: .5rem; } }
.marginalia { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .3rem 1rem; padding-block: .6rem; }
.marginalia a { color: var(--ink-muted); }

/* View tabs */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--ground); border-block: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: .7rem .2rem .55rem; font: 600 1.1rem/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-muted); }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--action); border-bottom-color: var(--action); }
.tab .n { font: 700 .66rem/1 var(--mono); letter-spacing: .04em; margin-left: .3rem; font-variant-numeric: tabular-nums; }
@media (max-width: 26rem) { .tab { font-size: .98rem; letter-spacing: .02em; } .tab .n { display: block; margin: .2rem 0 0; } }
.view { display: grid; gap: 1.4rem; padding-top: 1.6rem; min-width: 0; }
.view > * { min-width: 0; }
.view-head { display: grid; gap: .45rem; }

/* Day and level selectors */
.chips { display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none; padding-block: 2px; }
.chip { flex: none; background: none; border: 1px solid var(--line-strong); padding: .42rem .7rem; font: 700 .72rem/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; color: var(--ink); }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
.chip .sub { font-weight: 500; opacity: .75; margin-left: .35rem; }

/* The call */
.pill { display: inline-block; font: 700 .6rem/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; border: 1px solid currentColor; border-radius: 999px; padding: .12rem .5rem; white-space: nowrap; }
.call-go { color: var(--identity); }
.call-maybe { color: var(--machine); }
.call-skip { color: var(--ink-muted); }
.warn { color: var(--attention); }
.yours { color: var(--action); }

/* One talk at a time */
.card { background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--action); padding: clamp(1rem, 3vw, 1.6rem); display: grid; gap: 1rem; }
.card > * { min-width: 0; }
.card h3 { font: 600 clamp(1.7rem, 4.6vw, 2.5rem)/1 var(--display); letter-spacing: .025em; text-transform: uppercase; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.where { font: 600 .92rem/1.4 var(--body); }
.where .floor { color: var(--ink-muted); font-weight: 400; }
.speakers { color: var(--ink-muted); font-size: .92rem; overflow-wrap: anywhere; }
.rule { background: var(--raised); border-left: 3px solid var(--identity); padding: .85rem 1rem; display: grid; gap: .35rem; }
.rule.maybe { border-left-color: var(--machine); }
.rule.skip { border-left-color: var(--ink-muted); }
.rule.clash { border-left-color: var(--attention); }
.rule .mono.call-go { color: var(--identity); }
.rule .mono.call-maybe { color: var(--machine); }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; }
.act { flex: 1 1 auto; min-height: 2.9rem; background: none; border: 1px solid var(--line-strong); padding: .55rem .95rem; font: 600 1.08rem/1.1 var(--display); letter-spacing: .05em; text-transform: uppercase; display: inline-flex; align-items: center; justify-content: center; gap: .55rem; }
.act:hover { border-color: var(--ink); }
.act.armed { background: var(--action); border-color: var(--action); color: var(--on-action); }
kbd { font: 700 .66rem/1 var(--mono); border: 1px solid currentColor; border-radius: 4px; padding: .14rem .36rem; opacity: .8; }
@media (hover: none) { kbd { display: none; } .keyhelp { display: none; } }
.progress { display: flex; justify-content: space-between; gap: .3rem 1rem; flex-wrap: wrap; align-items: baseline; }
.meter { height: 3px; background: var(--line); }
.meter i { display: block; height: 100%; background: var(--action); }
.flash { display: flex; flex-wrap: wrap; gap: .2rem .7rem; align-items: baseline; font-size: .9rem; color: var(--ink-muted); }
details > summary { cursor: pointer; font-size: .86rem; color: var(--machine); }
details > div { display: grid; gap: .6rem; padding-top: .5rem; max-width: 42rem; }
.same { display: grid; gap: .1rem; }
.same button { display: grid; grid-template-columns: 4rem minmax(0, 1fr); gap: .6rem; align-items: baseline; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: .5rem 0; width: 100%; }
.same button:hover .tt { color: var(--action); }
.same .tt { font-size: .92rem; font-weight: 600; overflow-wrap: anywhere; }

/* Receipts */
.receipts { display: grid; gap: 1.4rem 2.4rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); align-items: start; }
.receipts > div { display: grid; gap: .1rem; min-width: 0; }
.receipt { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .6rem; align-items: baseline; border-top: 1px solid var(--line); padding: .45rem 0; font-size: .9rem; }
.receipt span { overflow-wrap: anywhere; }

/* Talks */
.filters { display: flex; flex-wrap: wrap; gap: .5rem; }
.filters input, .filters select { background: var(--deep); border: 1px solid var(--line-strong); padding: .5rem .6rem; font-size: .92rem; min-width: 0; }
.filters input { flex: 1 1 12rem; }
.filters select { flex: 0 1 11rem; }
.slot { display: grid; grid-template-columns: 5.2rem minmax(0, 1fr); gap: .8rem; border-top: 1px solid var(--line-strong); padding-top: .7rem; }
.slot > time { font: 700 .76rem/1.7 var(--mono); font-variant-numeric: tabular-nums; }
.items { display: grid; gap: 1.1rem; min-width: 0; }
.talk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .7rem; }
.talk > * { min-width: 0; }
.talk .t { font: 600 1.28rem/1.12 var(--display); letter-spacing: .015em; overflow-wrap: anywhere; }
.talk .line { font-size: .86rem; color: var(--ink-muted); grid-column: 1; overflow-wrap: anywhere; }
.talk .why { font-size: .9rem; grid-column: 1; max-width: 44rem; }
.talk details { grid-column: 1 / -1; }
.talk.is-skip .t, .talk.is-skip .why { color: var(--ink-muted); }
.minor { color: var(--ink-muted); font-size: .88rem; }
.star { grid-column: 2; grid-row: 1 / span 3; align-self: start; background: none; border: 1px solid var(--line); min-width: 2.6rem; min-height: 2.6rem; font-size: 1.15rem; line-height: 1; color: var(--ink-muted); }
.star:hover { border-color: var(--action); color: var(--action); }
.star[aria-pressed="true"] { background: var(--action); border-color: var(--action); color: var(--on-action); }
.notes { display: grid; gap: .8rem; border-top: 1px solid var(--line-strong); padding-top: 1.2rem; font-size: .88rem; color: var(--ink-muted); }
.notes ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; }

/* Calendar */
.next { background: var(--raised); border-left: 3px solid var(--action); padding: .9rem 1.1rem; display: grid; gap: .3rem; }
.next strong { font: 600 1.35rem/1.1 var(--display); letter-spacing: .02em; overflow-wrap: anywhere; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center; }
.days { display: grid; gap: 2rem 1.6rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); align-items: start; }
.day-col { display: grid; gap: .1rem; min-width: 0; }
.day-col .linkish { justify-self: start; }
.day-col h3 { font: 600 1.35rem/1 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0 0 .5rem; display: flex; justify-content: space-between; gap: .6rem; align-items: baseline; }
.ev { border-top: 1px solid var(--line); padding: .6rem 0; display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: .1rem .6rem; }
.ev > time { font: 700 .72rem/1.7 var(--mono); font-variant-numeric: tabular-nums; color: var(--action); }
.ev .body { display: grid; gap: .2rem; min-width: 0; }
.ev .t { font: 600 1.14rem/1.14 var(--display); letter-spacing: .015em; overflow-wrap: anywhere; }
.ev .line { font-size: .84rem; color: var(--ink-muted); overflow-wrap: anywhere; }
.ev .ctl { display: flex; flex-wrap: wrap; gap: .1rem .9rem; }
.ev.quiet > time { color: var(--ink-muted); font-weight: 500; }
.ev.quiet { padding-block: .35rem; }
.ev.quiet .body { color: var(--ink-muted); font-size: .84rem; }
.empty { border: 1px dashed var(--line-strong); padding: 1.1rem; display: grid; gap: .6rem; justify-items: start; color: var(--ink-muted); }
.empty .act { flex: 0 1 auto; color: var(--ink); }

/* Map */
.map-cols { display: grid; gap: 1.4rem 2.2rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 60rem) { .map-cols { grid-template-columns: minmax(0, 1fr) 21rem; } }
.map-col { display: grid; gap: .5rem; min-width: 0; }
.map-frame { background: var(--sheet); border: 1px solid var(--line-strong); overflow: auto; max-height: 92vh; }
.map-sheet { position: relative; width: 100%; }
.map-frame.zoomed .map-sheet { width: 250%; }
.map-sheet img { display: block; width: 100%; max-width: none; height: auto; }
.map-sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.room-mark { fill: #f4cf72; fill-opacity: .5; stroke: #17231b; mix-blend-mode: multiply; }
.room-mark.looked { fill: #f0b4a0; }
.pin-bg { fill: #17231b; }
.pin-bg.looked { fill: #8a3a24; }
.pin-tx { fill: #f4cf72; font-family: var(--mono); font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.pin-tx.looked { fill: #ffffff; }
.side { display: grid; gap: 1.3rem; min-width: 0; }
.side > div, .side > details { display: grid; gap: .35rem; }
.side ul { margin: 0; padding-left: 1.1rem; display: grid; gap: .35rem; font-size: .88rem; }
.route { font-size: .88rem; }
.route b { font-weight: 600; }
.stop { display: grid; grid-template-columns: 1.7rem minmax(0, 1fr); gap: .55rem; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: .55rem 0; width: 100%; align-items: start; }
.stop:hover .t { color: var(--action); }
.stop .num { font: 700 .72rem/1.65rem var(--mono); text-align: center; background: var(--deep); border: 1px solid var(--action); color: var(--action); height: 1.7rem; border-radius: 999px; }
.stop.looked .num { border-color: var(--attention); color: var(--attention); }
.stop .t { display: block; font: 600 1.05rem/1.14 var(--display); letter-spacing: .015em; overflow-wrap: anywhere; }
.stop .line { display: block; font-size: .8rem; color: var(--ink-muted); overflow-wrap: anywhere; }

.colophon { margin-top: 2.6rem; padding-top: .9rem; border-top: 1px solid var(--line-strong); display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem 1rem; font-size: .6rem; }
@media (max-width: 30rem) { .slot { grid-template-columns: minmax(0, 1fr); gap: .3rem; } }
/*NAV_CSS*/
</style>

<!--TOPNAV-->
<div class="sheet">
  <header class="masthead">
    <p class="mono agency">Unofficial personal field guide</p>
    <h1 id="name"></h1>
    <p class="sub">What to see, where it is, and how to get between the rooms.</p>
  </header>
  <div class="marginalia mono"><span id="where"></span><span id="tz"></span></div>

  <nav class="nav" aria-label="Guide sections">
    <button type="button" class="tab" data-view="go-through">Go through<span class="n" id="n-left"></span></button>
    <button type="button" class="tab" data-view="talks">Talks</button>
    <button type="button" class="tab" data-view="calendar">Calendar<span class="n" id="n-mine"></span></button>
    <button type="button" class="tab" data-view="map">Map</button>
  </nav>

  <main>
    <section class="view" id="view-go-through" hidden></section>
    <section class="view" id="view-talks" hidden></section>
    <section class="view" id="view-calendar" hidden></section>
    <section class="view" id="view-map" hidden></section>
  </main>

  <footer class="colophon mono"><span id="sync"></span><span id="verified"></span></footer>
</div>

<script>
const DATA = /*SITE_DATA*/null;

const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const $ = (id) => document.getElementById(id);
const btn = (cls, text, fn) => { const b = el("button", cls, text); b.type = "button"; b.addEventListener("click", fn); return b; };
const safeUrl = (u) => (/^https?:\/\//i.test(u || "") ? u : null);
const extLink = (text, url) => { const a = el("a", null, text); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; };

const rooms = new Map(DATA.venue.rooms.map((r) => [r.room_id, r]));
const byId = new Map(DATA.sessions.map((s) => [s.id, s]));
const untitled = new Set(DATA.untitled);
const CALLS = DATA.recommendations?.calls || {};
const CALL_LABEL = { go: "Go", maybe: "Could go either way", skip: "Skip" };
const FORMAT_LABEL = { talk: "Talk", keynote: "Keynote", panel: "Panel", workshop: "Workshop", break: "Break", registration: "Registration", social: "Social", "side-event": "Side event" };
const QUIET = new Set(["break", "registration"]);

// Times stay in the event's zone: read the wall clock from the offset-qualified string.
const clock = (iso) => {
  let h = +iso.slice(11, 13); const m = iso.slice(14, 16); const ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12; return `${h}:${m} ${ap}`;
};
const span = (s) => `${clock(s.start)}–${clock(s.end)}`;
const dayName = (date, style) => new Date(date + "T12:00:00Z").toLocaleDateString("en-US", { timeZone: "UTC", ...style });
const shortDay = (date) => dayName(date, { weekday: "short", month: "short", day: "numeric" });
const at = (iso) => Date.parse(iso);
const overlaps = (a, b) => a.id !== b.id && at(a.start) < at(b.end) && at(b.start) < at(a.end);
const zoneName = (style) => new Intl.DateTimeFormat("en-US", { timeZone: DATA.event.timezone, timeZoneName: style })
  .formatToParts(new Date(DATA.event.starts_on + "T12:00:00Z")).find((p) => p.type === "timeZoneName").value;
const floorOf = (s) => rooms.get(s.room)?.floor || null;
const roomText = (s) => rooms.get(s.room)?.name || (s.note ? `Off-site: ${s.note}` : "Location not published");
const whereText = (s) => (floorOf(s) ? `${roomText(s)} · ${floorOf(s)}` : roomText(s));
const speakerNames = (s) => s.speakers.map((id) => {
  const p = DATA.speakers[id]; if (!p) return id;
  return p.affiliation ? `${p.name} (${p.affiliation})` : p.name;
}).join(", ");
const canPick = (s) => !QUIET.has(s.format);

/* ---- Your plan: go or skip per session. Kept in this browser first, so it works on bad
   conference wifi, and in your account when the viewer provides one. ---- */
const SLUG = String(DATA.event.name).toLowerCase().replace(/[^a-z0-9]+/g, "-");
const PLAN_KEY = `${SLUG}-plan`, OLD_STARS_KEY = `${SLUG}-stars`;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let plan = (() => {
  try {
    const saved = JSON.parse(store.get(PLAN_KEY) || "null");
    if (saved?.picks) return saved;
  } catch {}
  // Stars from the earlier version of this guide carry over as calendar picks.
  const picks = {};
  try { for (const id of JSON.parse(store.get(OLD_STARS_KEY) || "[]")) if (byId.has(id)) picks[id] = "go"; } catch {}
  return { picks, updatedAt: 0 };
})();
let syncMode = "local", planDoc = null, pushTimer = null, pushing = false, pushAgain = false;

function renderSync() {
  $("sync").textContent = syncMode === "account" ? "Your plan follows your account across devices" : "Your plan is saved in this browser only";
}
async function pushPlan() {
  if (!planDoc) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try { await planDoc.set({ picks: plan.picks, updatedAt: plan.updatedAt }); syncMode = "account"; }
  catch { syncMode = "local"; }
  pushing = false; renderSync();
  if (pushAgain) { pushAgain = false; pushPlan(); }
}
function savePlan() {
  plan.updatedAt = Date.now();
  store.set(PLAN_KEY, JSON.stringify(plan));
  clearTimeout(pushTimer); pushTimer = setTimeout(pushPlan, 500);
}
async function connectAccount() {
  if (!window.claude?.use) return;
  const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  if (!db || !user) return;
  const id = await user.id();
  if (!id) return;
  planDoc = db.doc(`plans/${id}`);
  planDoc.onSnapshot((snap) => {
    syncMode = "account"; renderSync();
    const remote = snap.exists ? snap.data() : null;
    if (remote && Number(remote.updatedAt) > plan.updatedAt) {
      plan = { picks: { ...(remote.picks || {}) }, updatedAt: Number(remote.updatedAt) };
      store.set(PLAN_KEY, JSON.stringify(plan));
      render();
    } else if (plan.updatedAt > Number(remote?.updatedAt || 0) || (!remote && Object.keys(plan.picks).length)) {
      pushPlan();
    }
  }, () => { syncMode = "local"; renderSync(); });
}

const pickOf = (id) => plan.picks[id] || null;
const myGoes = () => DATA.sessions.filter((s) => pickOf(s.id) === "go").sort((a, b) => at(a.start) - at(b.start));
const clashesOf = (s) => myGoes().filter((o) => overlaps(s, o));

let lastAction = null;
function decide(id, value) {
  const before = pickOf(id);
  if (value) plan.picks[id] = value; else delete plan.picks[id];
  lastAction = { id, before, value };
  savePlan();
}
function undo() {
  if (!lastAction) return;
  const { id, before } = lastAction;
  if (before) plan.picks[id] = before; else delete plan.picks[id];
  state.current = id; lastAction = null;
  savePlan(); render();
}

/* ---- View state ---- */
const VIEWS = ["go-through", "talks", "calendar", "map"];
const state = { view: "go-through", flowDay: null, current: null, later: new Set(), talksDay: null, q: "", filter: "", mapDay: null, floor: "Level 2", looked: null, zoom: false };

function homeDay() {
  const today = new Date().toLocaleDateString("en-CA", { timeZone: DATA.event.timezone });
  return DATA.days.some((d) => d.date === today) ? today : DATA.days[0].date;
}
function setView(v, { top = true } = {}) {
  state.view = v;
  if (location.hash.slice(1) !== v) { try { location.hash = v; } catch {} }
  render();

  }
  const lookedRoom = looked && looked.day === state.mapDay && plan.rooms[looked.room] ? looked.room : null;
  if (lookedRoom && !groups.has(lookedRoom)) groups.set(lookedRoom, []);
  for (const [room, nums] of groups) {
    const [x, y, w, h] = plan.rooms[room];
    const isLooked = room === lookedRoom;
    svg.append(svgEl("rect", { x, y, width: w, height: h, "stroke-width": 2 * k }, `room-mark${isLooked ? " looked" : ""}`));
    const label = nums.length ? ranges(nums) : "?";
    const fs = 12 * k, ph = 22 * k, pw = Math.max(ph, (label.length * 7.6 + 12) * k);
    // Tucked in the room's corner so the plan's own room label stays readable.
    const cx = x + pw / 2 + 5 * k, cy = y + ph / 2 + 5 * k;
    svg.append(svgEl("rect", { x: cx - pw / 2, y: cy - ph / 2, width: pw, height: ph, rx: ph / 2 }, `pin-bg${isLooked ? " looked" : ""}`));
    const t = svgEl("text", { x: cx, y: cy, "font-size": fs }, `pin-tx${isLooked ? " looked" : ""}`); t.textContent = label; svg.append(t);
  }
}
function renderMap() {
  const box = $("view-map"); box.textContent = "";
  const head = el("div", "view-head");
  head.append(el("h2", null, "Your day on the map"));
  box.append(head);
  if (!DATA.maps) { head.append(el("p", "lede", "Floor plans aren't available for this event.")); return; }
  const stops = dayStops(state.mapDay);
  head.append(el("p", "lede", stops.length ? `Highlighted rooms are on your calendar for ${shortDay(state.mapDay)}. Numbers follow your day in order.` : `Nothing on your calendar for ${shortDay(state.mapDay)} yet. Add talks and their rooms light up here.`));
  box.append(dayChips(state.mapDay, (d) => { state.mapDay = d; state.looked = null; render(); }, (d) => { const n = myGoes().filter((s) => s.day === d).length; return n ? `${n}` : null; }));

  const floors = [...new Set(DATA.maps.plans.map((p) => p.floor))];
  const levels = el("div", "chips"); levels.setAttribute("role", "group"); levels.setAttribute("aria-label", "Choose a level");
  for (const f of floors) {
    const n = stops.filter(({ s }) => floorOf(s) === f).length;
    const b = btn("chip", f, () => { state.floor = f; render(); });
    b.setAttribute("aria-pressed", String(state.floor === f));
    if (n) b.append(el("span", "sub", `${n} ${n === 1 ? "stop" : "stops"}`));
    levels.append(b);
  }

  const plan = planFor(state.floor, state.mapDay);
  const cols = el("div", "map-cols");
  const col = el("div", "map-col");
  col.append(levels, el("span", "mono", plan.label));
  const frame = el("div", `map-frame${state.zoom ? " zoomed" : ""}`); frame.tabIndex = 0; frame.setAttribute("role", "region"); frame.setAttribute("aria-label", "Floor plan");
  const sheet = el("div", "map-sheet");
  const img = el("img"); img.id = "map-img"; img.alt = plan.alt; img.src = plan.src;
  img.addEventListener("load", drawOverlay);
  const svg = svgEl("svg", { id: "map-marks", viewBox: `0 0 ${MAP_UNITS} ${MAP_UNITS}`, "aria-hidden": "true" });
  sheet.append(img, svg); frame.append(sheet);
  col.append(frame);
  const zoom = btn("chip", state.zoom ? "Zoom out" : "Zoom in", () => { state.zoom = !state.zoom; render(); });
  zoom.setAttribute("aria-pressed", String(state.zoom)); zoom.style.justifySelf = "start";
  col.append(zoom);
  const credit = el("p", "mono"); credit.style.cssText = "letter-spacing:.04em;text-transform:none;font-weight:500";
  credit.append("Plans published by the organizers on the ");
  const src = safeUrl(DATA.maps.source_url);
  credit.append(src ? extLink("official venue map", src) : "official venue map");
  credit.append(". The highlights, notes and routes are this guide's own reading of them, so check on site.");
  col.append(credit);

  const side = el("div", "side");
  const list = el("div");
  list.append(el("span", "mono yours", `Your ${shortDay(state.mapDay)}`));
  const looked = state.looked && byId.get(state.looked);
  if (looked && pickOf(looked.id) !== "go" && looked.day === state.mapDay) {
    const b = btn("stop looked", null, () => { if (floorOf(looked)) { state.floor = floorOf(looked); render(); } });
    b.append(el("span", "num", "?"));
    const t = el("span"); t.append(el("span", "t", looked.title), el("span", "line", `Looking up, not on your calendar · ${span(looked)} · ${whereText(looked)}`)); b.append(t);
    list.append(b);
  }
  for (const { s, n } of stops) {
    const b = btn(`stop${looked?.id === s.id ? " looked" : ""}`, null, () => { state.looked = s.id; if (floorOf(s)) state.floor = floorOf(s); render(); });
    b.append(el("span", "num", `${n}`));
    const t = el("span"); t.append(el("span", "t", s.title), el("span", "line", `${span(s)} · ${whereText(s)}`)); b.append(t);
    list.append(b);
  }
  if (!stops.length) {
    list.append(btn("linkish", `Go through ${shortDay(state.mapDay)}`, () => { state.flowDay = state.mapDay; state.current = null; setView("go-through"); }));
  }
  side.append(list);
  const onPlan = el("details"); onPlan.open = true; onPlan.append(el("summary", null, "What's on this level"));
  const opb = el("div"); const ul = el("ul"); for (const n of plan.notes) ul.append(el("li", null, n)); opb.append(ul); onPlan.append(opb); side.append(onPlan);
  const routes = el("details"); routes.open = window.matchMedia("(min-width: 60rem)").matches; routes.append(el("summary", null, "Getting around"));
  const rb = el("div"); for (const r of DATA.maps.routes) { const p = el("p", "route"); p.append(el("b", null, r.title), `: ${r.text}`); rb.append(p); } routes.append(rb); side.append(routes);
  const names = el("details"); names.append(el("summary", null, "Room names")); const nb = el("div"); nb.append(el("p", "route", DATA.maps.names)); names.append(nb); side.append(names);
  cols.append(col, side);
  box.append(cols);
  if (img.complete) drawOverlay();
}

/* ---- Frame ---- */
function renderMast() {
  const e = DATA.event, v = DATA.venue;
  $("name").textContent = e.name;
  const where = $("where");
  where.append(`${dayName(e.starts_on, { month: "short", day: "numeric" })}–${dayName(e.ends_on, { month: "short", day: "numeric" })} · ${v.name} · `);
  const map = safeUrl(v.maps_url);
  if (map) where.append(extLink("Street map", map));
  $("tz").textContent = `All times ${zoneName("shortGeneric")}`;
  if (DATA.verified) $("verified").textContent = `Source pages last read ${new Date(DATA.verified).toLocaleString("en-US", { timeZone: e.timezone, dateStyle: "medium", timeStyle: "short" })}`;
}
function render() {
  const left = totalLeft(), mine = myGoes().length;
  $("n-left").textContent = left ? `${left}` : "";
  $("n-mine").textContent = mine ? `${mine}` : "";
  for (const t of document.querySelectorAll(".tab")) {
    if (t.dataset.view === state.view) t.setAttribute("aria-current", "page"); else t.removeAttribute("aria-current");
  }
  for (const v of VIEWS) $(`view-${v}`).hidden = v !== state.view;
  ({ "go-through": renderFlow, talks: renderTalks, calendar: renderCalendar, map: renderMap })[state.view]();
  renderSync();
}

for (const t of document.querySelectorAll(".tab")) t.addEventListener("click", () => setView(t.dataset.view));
window.addEventListener("hashchange", () => {
  const v = location.hash.slice(1);
  if (VIEWS.includes(v) && v !== state.view) { state.view = v; render(); }
});
document.addEventListener("keydown", (e) => {
  if (state.view !== "go-through" || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = e.target.tagName;
  if (["INPUT", "SELECT", "TEXTAREA"].includes(tag)) return;
  if (e.key === "Enter" && ["BUTTON", "A", "SUMMARY"].includes(tag)) return;
  if (e.key === "u") { undo(); return; }
  const s = state.current && byId.get(state.current);
  if (!s || pickOf(s.id)) return;
  const k = e.key;
  if (k === "Enter") { e.preventDefault(); acceptCall(s); }
  else if (k === "g") route(s, "go");
  else if (k === "x") route(s, "skip");
  else if (k === "j") later(s);
  else if (k === "m" && floorOf(s)) showOnMap(s);
  else if (k === "r") { const d = $("about"); if (d) d.open = !d.open; }
});
if (window.ResizeObserver) new ResizeObserver(() => { if (state.view === "map") drawOverlay(); }).observe(document.body);
setInterval(() => { if (state.view === "calendar" && !document.querySelector("details[open]")) renderCalendar(); }, 60000);

const start = homeDay();
const firstOpen = DATA.days.find((d) => d.date >= start && pile(d.date).length)?.date || DATA.days.find((d) => pile(d.date).length)?.date;
state.flowDay = firstOpen || start;
state.talksDay = start;
state.mapDay = myGoes().find((s) => at(s.end) > Date.now())?.day || start;
state.floor = "Level 2";
const initial = location.hash.slice(1);
state.view = VIEWS.includes(initial) ? initial : (firstOpen ? "go-through" : "calendar");

renderMast();
render();
if (window.claude?.use) {
  connectAccount();
  window.claude.use("downloads").then((d) => { downloads = d; if (state.view === "calendar") renderCalendar(); });
}
</script>
